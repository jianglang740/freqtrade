# 规则定义卡片：摆动结构（HH / HL / LH / LL）
# 模板见 09_quantification_spec.md §6

card_version: "v1"
concept_name: "Swing Structure（摆动结构序列）"
kb_references:
  - "04_structure_and_levels.md §1–2"
  - "13_price_action_factors.md §4 家族 B"
  - "09_quantification_spec.md §7 步骤 3"

domain_definition: >
  多头结构表现为 HH（更高的高点）与 HL（更高的低点）的交替序列；
  空头结构表现为 LL 与 LH。真实市场结构不规则，不要求每段都完美符合序列。

required_context:
  - "依赖 cards/swing_definition_v1.yaml 的已确认摆动点"

observable_inputs:
  - "已确认摆动高点表、已确认摆动低点表（各含 pivot_idx / confirmed_idx / price）"

operational_definition: >
  将两类摆动点按 pivot_idx 合并为一条序列（同一 right 下，确认顺序 = pivot 顺序）。
  每个摆动高点与"上一个摆动高点"的价格比较：更高记 HH，否则 LH。
  每个摆动低点与"上一个摆动低点"比较：更高记 HL，否则 LL。
  第一个同类摆动点无参照，标签为 UNKNOWN，不参与方向判定。

confirmation_rule: >
  某个摆动点的 HH/LH/HL/LL 标签，最早在**该摆动点自身** confirmed_idx 时可用；
  但若要比较"上一个同类摆动点"，而后者确认更晚，则标签推迟到两者都确认时。
  实现上取 max(自身 confirmed_idx, 参照点 confirmed_idx)。

invalidation_rule: >
  历史标签不撤销。新摆动点只会追加标签，不修改旧标签。

known_false_positives:
  - "在震荡中，相邻同类摆动点价格接近，HH/LH 的区分对微小噪声敏感"
  - "第一个同类摆动点标签为 UNKNOWN，不是中性"

lookahead_risk: >
  标签的 available_at = max(自身 confirmed_idx, 参照 confirmed_idx)。
  任何按 bar 生成的方向序列，在 bar t 只能纳入 confirmed_idx <= t 的摆动点。
  严禁把尚未确认的摆动点计入 t 时刻的结构判断。

available_at: "max(自身 confirmed_idx, 参照 confirmed_idx) 对应 K 线的收盘"

unit_test_cases:
  - "上升序列 high 依次抬高 → 依次为 HH"
  - "下降序列 low 依次降低 → 依次为 LL"
  - "第一个同类摆动点标签为 UNKNOWN"
  - "结构方向序列在 t 只使用 confirmed_idx <= t 的点"

visual_review_cases:
  - "BTC 4h 取 500 根，人工核对 HH/HL 是否对应肉眼可见的上升结构"

trading_hypothesis: >
  结构方向是多空背景的一个维度，本身不是入场信号（01 §4：方向偏向、设置质量、
  风险可行性必须分开）。在 13 §9 链路中作为条件变量参与统计检验。

validation_plan: >
  1) 单元测试覆盖上述用例；
  2) 统计各标签占比，确认不是退化为单一标签；
  3) 在统计闸门中作为分层维度使用。

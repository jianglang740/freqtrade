# 规则定义卡片：确认式摆动点
# 模板见 09_quantification_spec.md §6
# 状态：operational_definition / confirmation_rule / lookahead_risk 已填写，允许进入编码

card_version: "v1"
concept_name: "Confirmed Swing Point（确认式摆动点）"
kb_references:
  - "04_structure_and_levels.md §1–2"
  - "09_quantification_spec.md §6–7"
  - "17_implementation_landscape.md §2（所有摆动库都会重绘）"

domain_definition: >
  摆动高点是某段局部上涨后的重要高位，摆动低点是某段局部下跌后的重要低位。
  它们用于观察市场结构，但只有经过明确定义的确认规则才能用于算法。

required_context:
  - "无。摆动点是结构层的基础对象，不依赖其他事件或状态。"

observable_inputs:
  - "high, low（单根 K 线，已收盘）"

operational_definition: >
  设左窗口 L、右窗口 R（默认 L=R=2）。
  第 i 根 K 线是摆动高点，当且仅当窗口 [i-L, i+R] 完整、且
  high[i] == max(high[i-L .. i+R]) 且 high[i] > high[i-1]
  （第二个条件用于在平台期只取第一次出现，保证摆动点不重叠）。
  摆动低点对称：low[i] == min(low[i-L .. i+R]) 且 low[i] < low[i-1]。
  窗口不完整（i < L 或 i+R >= n）时不出摆动点。

confirmation_rule: >
  第 i 根 K 线的摆动高点在第 i+R 根 K 线收盘后确认，即 confirmed_idx = pivot_idx + R。

confirmation_delay: R

invalidation_rule: >
  已确认摆动点是历史事实，不撤销。当同一区域被后续更极端的摆动点取代时，
  由 structure 层决定是否更新"当前有效结构位"，摆动点本身保留。

known_false_positives:
  - "窄幅震荡中会产生大量紧邻摆动点，属结构噪声而非错误"
  - "L/R 越小越敏感、越大越滞后；这是定义选择，不是缺陷"

lookahead_risk: >
  必须分开保存 pivot_idx（极值实际发生位置）与 confirmed_idx（可确认位置）。
  因子与信号只能从 confirmed_idx 起使用该摆动点（04 §2、09 §3）。
  严禁用未来数据确认后把标签回填到过去并生成过去的交易信号。

available_at: "confirmed_idx 对应 K 线的收盘时间"

unit_test_cases:
  - "5 根 K 线，仅中间一根 high 最高，L=R=2：该根为摆动高点，confirmed 在第 5 根"
  - "平台期 high 相等：只取第一次出现，不得产生多个摆动点"
  - "窗口不完整：前 L 根与后 R 根不得产生摆动点"
  - "pivot_idx + R == confirmed_idx 对所有输出成立"

visual_review_cases:
  - "BTC 4h 任取 500 根，人工核对摆动点是否落在肉眼可见的局部高低"

trading_hypothesis: >
  摆动点本身不是交易信号。它是 HH/HL/LH/LL 结构、关键位置、回调腿计数的原料。
  按 13 §9 的链路，摆动点只做到"概念验证 / 事件验证"两步。

validation_plan: >
  1) 单元测试覆盖上述边界；
  2) 在 BTC/ETH 4h 上导出图人工核验；
  3) 统计摆动点平均间距，与 20_bar_feature_calibration.md §4.4 的连长基准比对量级。

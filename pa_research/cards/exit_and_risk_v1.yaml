# 规则定义卡片：出场与风险（结构性）
# 模板见 09_quantification_spec.md §6
#
# ┌────────────────────────────────────────────────────────────────────┐
# │ 本卡片在写任何出场代码之前冻结。                                   │
# │ 参数一经写下不得因回测结果回溯修改 —— 否则即为 13 §1 / 18 §3 的     │
# │ "从回测结果反推规则"。若需改动，另起 v2 并说明改动的独立理由。      │

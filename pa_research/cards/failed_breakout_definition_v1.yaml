# 规则定义卡片：突破 / 跟随 / 失败突破状态机
# 模板见 09_quantification_spec.md §6

card_version: "v1"
concept_name: "Breakout / Follow-through / Failed Breakout State Machine"
kb_references:
  - "05_setups_and_events.md §1–3、§12"
  - "09_quantification_spec.md §3（事件时间模型）、§5（状态机示意图）"
  - "13_price_action_factors.md §4 家族 D"

domain_definition: >
  突破：价格越过一个具有意义的结构边界。关键不是"是否超过前高"，而是边界当时是否已知、
  是否收盘确认、突破 K 线是否有力度、后续是否跟随、发生在何种状态（05 §1）。
  失败突破：突破未能维持在边界外，价格重新回到原区间（05 §3）。

required_context:
  - "已确认摆动点（swing_definition_v1）"
  - "市场状态候选（state_and_levels_v1）"

observable_inputs:
  - "open/high/low/close；已确认摆动高点/低点表；feat_close_location；波动尺度"

operational_definition: >
  边界：向上突破的边界 = 最近一个 confirmed_idx <= t 的已确认摆动高点价格；
  向下突破对称（最近的已确认摆动低点）。边界在 t 时刻已可知。

  突破候选（BREAKOUT_CANDIDATE）：第 t 根 K 线收盘 > 边界，且前一根收盘 <= 边界
  （只在首次穿越时产生一个候选，不在每根 K 线重复产生）。

  跟随确认（FOLLOW_THROUGH_CONFIRMED）：候选后 follow_window 根内，
  出现收盘沿突破方向进一步推进的一根。

  回到区间（FAILED_BREAKOUT_CANDIDATE）：候选后 fail_window 根内先出现收盘回到边界内。

  失败突破确认（FAILED_BREAKOUT_CONFIRMED）：回到区间后，再出现收盘越过
  **反向参照位**（向上突破失败时用其之前的已确认摆动低点）。

  过期（EXPIRED）：在 fail_window 内既未跟随也未回到区间。

confirmation_rule: >
  候选在 t 收盘即成立（available_at = bar t 收盘）。
  跟随/失败/过期属于**结果标签**，其确认时点 outcome_idx 记录在案，
  仅供评估使用，**不得**作为 t 时刻的输入特征。

invalidation_rule: >
  候选被"回到区间"或"过期"终结时，不再继续跟踪；不产生第二个独立事件。
  每个候选有唯一 event_id。

known_false_positives:
  - "窄幅盘整中边界极近，会产生大量紧邻的候选（属噪声）"
  - "仅影线穿越不算突破（本定义要求收盘），故会漏掉部分真实突破"
  - "fail_window 取值影响失败率，须作为参数披露"

lookahead_risk: >
  这是本库最易出错之处。候选的输入特征（边界、突破距离、收盘质量、当时状态）
  全部只用 t 及之前的数据；跟随/失败标签用到未来数据，属于**被预测对象**。
  实现须把 feat_*（输入）与 outcome_*/label_*（结果）在列名与数据结构上分开，
  并在报告中声明哪些列是未来数据。

available_at: "候选：bar t 收盘；结果标签：outcome_idx 收盘（仅用于评估）"

unit_test_cases:
  - "构造收盘首次上穿已确认摆动高点 → 产生一个候选，event_id 唯一"
  - "同一根不重复产生候选（连续收盘在边界外只记一次）"
  - "候选后一根收盘更高 → outcome=follow_through"
  - "候选后收盘回到边界内 → outcome=failed"
  - "候选后既未跟随也未回落 → outcome=expired"
  - "outcome_idx 严格大于 candidate_idx"

visual_review_cases:
  - "BTC 4h 取 500 根，核对被标为 failed 的突破是否肉眼确为假突破"

trading_hypothesis: >
  A 组：突破 + 跟随确认 + 回踩，可能提供比追突破更清晰的失效位置（05 §2）。
  B 组：失败突破后被困交易者的反向平仓流可能推动反向运动（05 §3）。
  两者都依赖"状态/位置"条件化——这正是 16 §14.3 指出的、文献尚未检验的方向。

validation_plan: >
  1) 单元测试覆盖上述用例；
  2) 统计候选的无条件发生率与失败率，对照 15 §2 的公开失败率（须注明定义差异），
     警惕"70% 突破失败"这类只来自 1 分钟数据的民间说法；
  3) 在统计闸门中按状态/位置分层，检验条件化是否带来增量。
